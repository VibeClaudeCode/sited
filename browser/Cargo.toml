[package]
name = "aurora"
version = "0.1.0"
edition = "2021"
description = "Aurora — fast motion-designed browser in Rust (Chromium/WebView2 engine on Windows)"
license = "MIT"

[dependencies]
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
url = "2"
percent-encoding = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true


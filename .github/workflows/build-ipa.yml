name: Build Swiftgram Tontoho IPA

# Run manually: Actions -> "Build Swiftgram Tontoho IPA" -> Run workflow.
# Optional repository secrets (Settings -> Secrets and variables -> Actions):
#   TG_API_ID / TG_API_HASH - your own keys from https://my.telegram.org/apps
# Without them the stock keys from Swiftgram's appstore-configuration.json are used.
on:
  workflow_dispatch:
    inputs:
      swiftgram_ref:
        description: "Swiftgram/Telegram-iOS commit or branch to build"
        required: true
        default: "ead4834a191063840864ef73aed8713f41c8a485"
      apply_patches:
        description: "Apply the mod patches (turn off to build plain Swiftgram for comparison)"
        type: boolean
        required: true
        default: true
      runner:
        description: "Runner image (Swiftgram needs Xcode 27.1, which is on xcode-27)"
        required: true
        default: "xcode-27"

jobs:
  build:
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 360

    steps:
      - name: Checkout this repo (patch)
        uses: actions/checkout@v4
        with:
          path: mod

      - name: Free disk space
        run: |
          sudo rm -rf /Users/runner/Library/Android /usr/local/share/dotnet /usr/local/lib/node_modules || true
          df -h /

      - name: Clone Swiftgram and apply patch
        run: |
          set -ex
          sudo mkdir -p /Users/Shared
          sudo chown "$USER" /Users/Shared
          git clone https://github.com/Swiftgram/Telegram-iOS.git /Users/Shared/telegram-ios
          cd /Users/Shared/telegram-ios
          git checkout "${{ inputs.swiftgram_ref }}"
          git submodule update --init --recursive --depth 1 --jobs 8 || git submodule update --init --recursive --jobs 8
          if [ "${{ inputs.apply_patches }}" = "false" ]; then
            echo "::warning::Building plain Swiftgram without the mod patches"
          else
          # tontoho-mode.patch first, then the other patches in name order
          git apply --whitespace=nowarn "$GITHUB_WORKSPACE/mod/patches/tontoho-mode.patch"
          for p in $(ls "$GITHUB_WORKSPACE"/mod/patches/*.patch | sort); do
            [ "$(basename "$p")" = "tontoho-mode.patch" ] && continue
            echo "Applying $(basename "$p")"
            git apply --whitespace=nowarn "$p"
          done
          fi
          git status --short | head -50
          # The bundled fake provisioning profiles have expired; rules_apple's
          # plisttool rejects expired profiles. The IPA is re-signed by the user
          # anyway, so skip that check.
          PT=build-system/bazel-rules/rules_apple/tools/plisttool/plisttool.py
          python3 - "$PT" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          old = "if expire and expire < datetime.datetime.now():"
          assert old in s, "expiration check not found in plisttool"
          open(p, "w").write(s.replace(old, "if False and expire and expire < datetime.datetime.now():"))
          print("Disabled provisioning profile expiration check")
          PY

      - name: Select Xcode
        run: |
          cd /Users/Shared/telegram-ios
          WANT=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          echo "Wanted Xcode $WANT; installed:"; ls -d /Applications/Xcode*.app
          if [ -d "/Applications/Xcode_$WANT.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_$WANT.app/Contents/Developer"
          else
            NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
            echo "::warning::Xcode $WANT not on runner, using $NEWEST"
            sudo xcode-select -s "$NEWEST/Contents/Developer"
          fi
          xcodebuild -version
          df -h /

      - name: Write build configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          cd /Users/Shared/telegram-ios
          python3 - <<'PY'
          import json, os
          c = json.load(open("build-system/appstore-configuration.json"))
          # Swiftgram requires sg_config (JSON string); "{}" -> built-in defaults.
          c.setdefault("sg_config", "{}")
          # Sideloading (SideStore/AltStore/Sideloadly with a free Apple ID) strips the
          # iCloud and Siri entitlements; with iCloud enabled CloudKit traps on launch.
          c["enable_icloud"] = False
          c["enable_siri"] = False
          if os.environ.get("TG_API_ID") and os.environ.get("TG_API_HASH"):
              c["api_id"] = os.environ["TG_API_ID"]
              c["api_hash"] = os.environ["TG_API_HASH"]
              print("Using api_id/api_hash from repository secrets")
          else:
              print("::warning::TG_API_ID/TG_API_HASH not set, using stock keys from appstore-configuration.json")
          json.dump(c, open("build-system/ci-configuration.json", "w"), indent=2)
          PY

      - name: Build
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot=/private/var/tmp/_bazel_ci \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-system/ci-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"
          mkdir -p "$GITHUB_WORKSPACE/out"
          IPA=""
          for candidate in bazel-bin/Telegram/Swiftgram.ipa bazel-bin/Telegram/Telegram.ipa; do
            if [ -f "$candidate" ]; then IPA="$candidate"; break; fi
          done
          if [ -z "$IPA" ]; then
            IPA=$(find -L bazel-bin/Telegram bazel-out -maxdepth 6 -name '*.ipa' 2>/dev/null | head -1)
          fi
          echo "IPA: $IPA"
          test -n "$IPA"
          cp -L "$IPA" "$GITHUB_WORKSPACE/out/Swiftgram-Tontoho.ipa"
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.apply_patches == false && 'Swiftgram-plain-ipa' || 'Swiftgram-Tontoho-ipa' }}
          path: out/Swiftgram-Tontoho.ipa
          retention-days: 14
